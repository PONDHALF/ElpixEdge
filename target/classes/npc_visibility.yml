# ==========================================
# NPC Visibility Rules (Tag-Based)
# ==========================================
# Each NPC is identified by its FancyNPCs ID (the name used in /npc create).
#
# Rules:
#   hide_if_has_tags:       List of tags. If the player has ANY of these tags, the NPC is hidden.
#   show_only_if_has_tags:  List of tags. The player must have ALL of these tags to see the NPC.
#
# Both rules are evaluated: show_only_if_has_tags is checked first, then hide_if_has_tags.
# Backward compatible: single-string keys (hide_if_has_tag / show_only_if_has_tag) also work.
#
# Example:
#   guide_01:
#     hide_if_has_tags:
#       - "the_awakening_start"
#   guide_02:
#     show_only_if_has_tags:
#       - "the_awakening_start"
# ==========================================
npc_visibility:
  guide_01:
    hide_if_has_tags:
      - "awakening_started"
  guide_02:
    show_only_if_has_tags:
      - "awakening_started"
