# ==========================================
# Quest Trigger Definitions
# ==========================================
# Each trigger defines conditions and actions for quest progression.
#
# Fields:
#   type:          "npc_click", "enter_region", "mob_cleared"
#   npc_name:      NPC display name to match (for npc_click type)
#   required_tags: List of tags the player must have (prefix with ! for negation)
#   add_tags:      List of tags to add when triggered
#   remove_tags:   List of tags to remove when triggered
#   message:       Optional message to send (supports & color codes)
#   teleport:      Optional teleport "world, x, y, z, yaw, pitch"
# ==========================================
quest_triggers:
  # Example trigger: NPC click starts a quest
  example_quest_start:
    type: "npc_click"
    npc_name: "Village Elder"
    required_tags: []
    add_tags:
      - "quest_village_started"
    remove_tags: []
    message: "&6[Quest] &7The Village Elder has given you a task!"
    teleport: ""

  # Example trigger: Quest step 2 with tag check + teleport
  example_quest_dungeon:
    type: "npc_click"
    npc_name: "Dungeon Guide"
    required_tags:
      - "quest_village_started"
    add_tags:
      - "dungeon_entered"
    remove_tags:
      - "quest_village_started"
    message: "&5[Dungeon] &7You have entered the private dungeon!"
    teleport: "world, 200, 64, -100, 0, 0"

  the_awakening_start:
    type: "npc_click"
    npc_name: "guide_01"
    required_tags: 
      - "!awakening_complete"
      - "!awakening_started"
    add_tags:
      - "awakening_started"
    message: "&eGuide: The awakening trial awaits you."

  the_awakening_repeat:
    type: "npc_click"
    npc_name: "guide_01"
    required_tags:
      - "awakening_started"
      - "!awakening_complete"
    message: "&cYou are already undertaking the trial."

  the_awakening_complete:
    type: "mob_cleared"
    required_tags:
      - "awakening_started"
      - "!awakening_complete"
    add_tags:
      - "awakening_complete"
    remove_tags:
      - "awakening_started"
    message: "&aYou have completed the trial!"
