# ==========================================
# Instance Definitions
# ==========================================
# Each instance defines a schematic, spawn offset, and mobs.
#
# Mob types can be:
#   - Custom mob ID (e.g. "ruined_skeleton") — from config mobs section
#     Gets full RPG integration: BetterModel, equipment, abilities, HP scaling
#   - Vanilla EntityType (e.g. "ZOMBIE") — basic mob with quest tracking
#
# Fields:
#   type:   Custom mob ID or vanilla EntityType name
#   amount: Number of mobs to spawn
#   level:  Mob level (for custom mobs, affects HP/DMG scaling)
#   name:   Optional custom display name (for vanilla mobs only)
#   offset: Spawn offset from paste origin "x, y, z"
# ==========================================
instances:
  trial_room:
    schematic: "trial_room"
    spawn_offset: "5, 1, 5"
    mobs:
      - type: ruined_skeleton
        amount: 3
        level: 10
        offset: "10, 1, 10"