# ==========================================
# Custom Crafting Recipes
# ==========================================
# Each recipe defines:
#   requires:          Unlock requirement (e.g. "collection:combat:ENDERMAN:5")
#   shape:             3-line crafting grid pattern
#   ingredients:       Character-to-item mapping (custom item ID or vanilla MATERIAL)
#   output_type:       Optional. "enchant_book" for enchant book output
#   output_enchant_id: Required if output_type is enchant_book
# ==========================================
recipes:
  aspect_of_the_end:
    requires: "collection:combat:ENDERMAN:5"
    shape:
      - " E "
      - " E "
      - " S "
    ingredients:
      E: "end_shard"
      S: "DIAMOND_SWORD"

  shadow_fury:
    requires: "collection:combat:ENDERMAN:10"
    shape:
      - " O "
      - "OSO"
      - " O "
    ingredients:
      O: "singularity_fragment"
      S: "NETHERITE_SWORD"

  sand_blade:
    requires: "collection:combat:HUSK:5"
    shape:
      - " S "
      - " S "
      - " I "
    ingredients:
      S: "coarse_flesh"
      I: "STICK"

  auto_smelter:
    requires: "collection:mining:STONE:5"
    shape:
      - "CCC"
      - "CFC"
      - "CCC"
    ingredients:
      C: "COBBLESTONE"
      F: "FURNACE"

  golden_carrot:
    requires: "collection:gathering:CARROTS:5"
    shape:
      - "GGG"
      - "GCG"
      - "GGG"
    ingredients:
      G: "GOLD_NUGGET"
      C: "CARROT"

  # ==========================================
  # Unique Enchant Book Recipes
  # Crafted at Crafting Bench after unlocking via Collection reward.
  # output_type: enchant_book -> result is a specific named ENCHANTED_BOOK
  # ==========================================

  # Aiming Books (requires Skeleton Collection Lv5)
  book_aiming_1:
    requires: "collection:combat:SKELETON:5"
    output_type: enchant_book
    output_enchant_id: aiming_1
    shape:
      - " B "
      - "BCB"
      - " B "
    ingredients:
      B: "BOOK"
      C: "curse_marrow"

  book_aiming_2:
    requires: "collection:combat:SKELETON:5"
    output_type: enchant_book
    output_enchant_id: aiming_2
    shape:
      - "BCB"
      - "CAC"
      - "BCB"
    ingredients:
      B: "BOOK"
      C: "curse_marrow"
      A: "enchant_book:aiming_1"

  book_aiming_3:
    requires: "collection:combat:SKELETON:5"
    output_type: enchant_book
    output_enchant_id: aiming_3
    shape:
      - "BCB"
      - "CAC"
      - "BCB"
    ingredients:
      B: "BOOK"
      C: "curse_marrow"
      A: "enchant_book:aiming_2"

  # Fire Aspect III Book (requires Husk Collection Lv4)
  book_fire_aspect_3:
    requires: "collection:combat:HUSK:4"
    output_type: enchant_book
    output_enchant_id: fire_aspect_3
    shape:
      - "FBF"
      - "BFB"
      - "FBF"
    ingredients:
      B: "BOOK"
      F: "coarse_flesh"

  # Life Steal Books (requires Zombie Collection Lv4)
  book_life_steal_1:
    requires: "collection:combat:ZOMBIE:4"
    output_type: enchant_book
    output_enchant_id: life_steal_1
    shape:
      - " B "
      - "BCB"
      - " B "
    ingredients:
      B: "BOOK"
      C: "corrupted_flesh"

  book_life_steal_2:
    requires: "collection:combat:ZOMBIE:4"
    output_type: enchant_book
    output_enchant_id: life_steal_2
    shape:
      - "BCB"
      - "CAC"
      - "BCB"
    ingredients:
      B: "BOOK"
      C: "corrupted_flesh"
      A: "enchant_book:life_steal_1"

  book_life_steal_3:
    requires: "collection:combat:ZOMBIE:4"
    output_type: enchant_book
    output_enchant_id: life_steal_3
    shape:
      - "BCB"
      - "CAC"
      - "BCB"
    ingredients:
      B: "BOOK"
      C: "corrupted_flesh"
      A: "enchant_book:life_steal_2"
      
  # Nullify Book (requires Enderman Collection Lv5)
  book_nullify_1:
    requires: "collection:combat:ENDERMAN:5"
    output_type: enchant_book
    output_enchant_id: nullify_1
    shape:
      - " B "
      - "BSB"
      - " B "
    ingredients:
      B: "BOOK"
      S: "end_shard"
