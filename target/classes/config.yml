# ==========================================
# ElpixEdge - Default Configuration
# ==========================================

# ==========================================
# Core Settings
# ==========================================
game_settings:
  active_skills_gcd:
    teleport: 500
    heal: 2000
    aoe_slash: 3000
    shield_bash: 3500
    arcane_bullet: 500
    ashen_spark: 1000
    little_phoenix: 5000

# ==========================================
# Leveling Formulas
# ==========================================
leveling:
  skills:
    base_exp: 1000.0
    multiplier: 1.2
  collections:
    base_exp: 2000.0
    multiplier: 1.5
    max_level: 5
    exp_multiplier: 1.0

# ==========================================
# Skills Settings & Stats
# ==========================================
skills:
  combat:
    default_exp: 5
    stat_gain:
      damage: 0.5
      crit_chance: 0.2
      crit_damage: 1.0
    custom_targets:
      apex_enderman: 10
      ruined_skeleton: 5

  mining:
    default_exp: 5
    stat_gain:
      defense: 0.5
    custom_targets:
      DIAMOND_ORE: 50

  gathering:
    default_exp: 5
    stat_gain:
      health: 1.0
    custom_targets:
      WHEAT: 10

  arcane:
    stat_gain:
      magic_damage: 1.0
      DROP_MULT: 0.05
    custom_targets:
      apex_enderman: 20

  enchantment:
    default_exp: 5
    stat_gain:
      max_mana: 2.0
      mana_regen: 0.5
      GCD_REDUC: 0.01
    custom_targets:
      LAPIS_ORE: 20
      DEEPSLATE_LAPIS_ORE: 20
      BOOKSHELF: 10

# ==========================================
# Custom Mob + Drops
# ==========================================
mobs:
  zombie:
    rare_drops:
      corrupted_flesh: 0.02
  husk:
    rare_drops:
      corrupted_flesh: 0.01
      coarse_flesh: 0.02
  skeleton:
    rare_drops:
      curse_marrow: 0.02
  enderman:
    rare_drops:
      end_shard: 0.01



  # ==========================================
  # normal mob
  # ==========================================

  ruined_skeleton:
    base_entity: SKELETON
    tier_hp_mult: 10.0
    tier_dmg_mult: 1.0
    equipment:
      helmet: "iron_helmet"
      chestplate: ""
      leggings: ""
      boots: ""
      mainhand: ""
      offhand: ""
    better_model:
      model_id: ""
      normal_attack:
        animation: ""

    rare_drops:
      curse_marrow: 0.02
    unique_drops:
      ancient_bow: 0.01



  # ==========================================
  # Boss
  # ==========================================


  apex_enderman:
    base_entity: ENDERMAN
    # Tier HP multiplier: maxHp = base_hp + (level * tier_hp_mult). Default 10.0
    tier_hp_mult: 15.0
    # Tier DMG multiplier: mob damage = base_dmg + (level * tier_dmg_mult). Default 1.0
    tier_dmg_mult: 2.0
    # BetterModel integration (optional) — requires BetterModel plugin
    # model_id: the custom model ID registered in BetterModel
    better_model:
      model_id: "apex_enderman"
      attack_animation: "attack"
    rare_drops:
      end_shard: 0.1
    unique_drops:
      singularity_fragment: 0.01

  blighted_wyvern:
    base_entity: RAVAGER
    tier_hp_mult: 50.0
    tier_dmg_mult: 5.0
    equipment:
      helmet: ""
      chestplate: ""
      leggings: ""
      boots: ""
      mainhand: ""
      offhand: ""

    better_model:
      model_id: "blighted_wyvern"
      name_height: 5
      normal_attack:
        animation: "attack"

      ability1:
        animation: "attack1"
        ability: "corrupted_breath"
        cooldown: 10
        distant: 5
        damagemultiplier: 5

      ability2:
        animation: "attack2"
        ability: "corrupted_dive"
        cooldown: 20
        distant: 10
        damagemultiplier: 50

    rare_drops:
      end_shard: 0.1
    unique_drops:
      singularity_fragment: 0.01




