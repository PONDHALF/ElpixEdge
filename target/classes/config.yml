# ==========================================
# Custom Spawner Locations
# Location-based mob spawning system with proximity activation,
# wandering AI, player hunting, and despawn/respawn timers.
# ==========================================
spawners:
  # Example: Canyon Bandit Camp
  canyon_bandit_camp:
    # Spawn locations (world, x, y, z)
    locations:
      - "world, 100, 65, -200"
      - "world, 105, 65, -202"

    # Custom mob pool with spawn weights (higher = more likely)
    mobs:
      apex_enderman: 70
      zombie: 30

    # Level range for spawned mobs (min-max)
    level_range: "11-15"

    # Max alive mobs per spawn location (prevents overcrowding)
    max_alive_per_location: 1

    # Player proximity required to activate spawning (in blocks)
    activation_range: 40

    # Wander radius around spawn point (blocks)
    wander_radius: 5

    # Player hunt detection range (blocks)
    hunt_range: 15

    # Duration to chase player after leaving hunt_range (seconds)
    hunt_duration: 30

    # Time before idle mob despawns when outside wander_radius (seconds)
    despawn_timeout: 300

    # Time to wait before respawning after death/despawn (seconds)
    respawn_time: 10

# ==========================================
# Tag & Quest Trigger System
# Foundation for quests and dungeons.
# ==========================================
tag_system:
  # Async save interval in seconds (how often dirty tags flush to disk)
  save_interval: 300

