# ==========================================
# Dungeon Configuration (Multi-Room System)
# ==========================================
dungeons:
  slime_temple:
    template: "temple_schematic" # ชื่อไฟล์ Schematic (.schem)
    private: true                # เป็นดันเจี้ยนส่วนตัว
    rooms:
      # --- ห้องที่ 1: โถงทางเข้า ---
      entrance:
        name: "&6โถงทางเข้า"
        spawn_point: "5, 65, 5"        # จุดเกิดเมื่อเริ่ม (สัมพันธ์กับจุดวาง Schematic 0,64,0)
        clear_condition: "KILL_ALL"     # ต้องฆ่ามอนสเตอร์ทั้งหมด
        mobs:
          - mob_id: "ruined_skeleton"
            amount: 4
            level: 10
            loc: "10, 65, 10"
        exit_min: "20, 64, -2"         # พิกัดกล่องทางออกของห้องที่ 1
        exit_max: "22, 68, 2"

      # --- ห้องที่ 2: ห้องโถงกลาง ---
      main_hall:
        name: "&eโถงกลางวิหาร"
        spawn_point: "50, 65, 0"       # เมื่อเดินเข้าประตูห้อง 1 จะวาร์ปมาจุดนี้
        clear_condition: "KILL_TARGET"  # ฆ่าตัวเป้าหมายเพื่อผ่าน
        target_mob: "gatekeeper"
        mobs:
          - mob_id: "gatekeeper"
            amount: 1
            level: 15
            loc: "70, 65, 0"
        exit_min: "90, 64, -2"         # พิกัดกล่องทางออกของห้องที่ 2
        exit_max: "92, 68, 2"

      # --- ห้องที่ 3: ห้องบอส (ห้องสุดท้าย) ---
      boss_room:
        name: "&c&lห้องบอสใหญ่"
        spawn_point: "150, 65, 0"
        clear_condition: "KILL_TARGET"
        target_mob: "slime_lord"
        mobs:
          - mob_id: "slime_lord"
            amount: 1
            level: 25
            loc: "170, 65, 0"
        exit_min: "190, 64, -2"        # เมื่อเดินเข้ากล่องนี้จะออกจากดันเจี้ยน
        exit_max: "192, 68, 2"
