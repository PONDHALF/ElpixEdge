    respawn_time_sec: 600
    skill_exp: 500.0
    collection_id: "boss_loot"
    collection_exp: 50.0
    rewards:
      - item_id: "rare_shard"
        chance: 0.2
        min: 1
        max: 1
      - item_id: "minecraft:gold_ingot"
        chance: 1.0
        min: 3
        max: 8

  dungeon_reward:
    type: "dungeon"
    display_name: "&b&lสมบัติลับดันเจี้ยน"
    dungeon_id: "slime_temple"
    room_id: "boss_room"
    block_type: "SHULKER_BOX"
    skill_exp: 200.0
    rewards:
      - item_id: "dungeon_key"
        chance: 1.0
        min: 1
        max: 1
