# ==========================================
# Loot Chest Templates
# ==========================================
templates:
  starter_exploration:
    type: "exploration"
    display_name: "&e&lสมบัติผู้เริ่มต้น"
    block_type: "CHEST"
    skill_exp: 100.0
    collection_id: "starter_finds"
    collection_exp: 25.0
    rewards:
      - item_id: "wooden_sword"
        chance: 1.0
        min: 1
        max: 1
      - item_id: "minecraft:apple"
        chance: 0.5
        min: 2
        max: 5

  miniboss_event:
    type: "event"
    display_name: "&c&lรางวัลบอสประจำถิ่น"
